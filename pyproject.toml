[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hf-object-detection"
version = "1.0.0"
description = "Plug-and-play object detection pipeline built on Hugging Face Transformers"
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.9"
authors = [
    {name = "souravMOD"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.35",
    "albumentations>=1.3",
    "pillow>=9.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "torchmetrics>=1.0",
]

[project.optional-dependencies]
wandb = ["wandb>=0.15"]
prometheus = ["prometheus-client>=0.17"]
mlops = ["wandb>=0.15", "prometheus-client>=0.17"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "pre-commit>=3.0",
]
all = [
    "hf-object-detection[mlops,dev]",
]

[project.scripts]
hf-detect-train = "src.train:main"
hf-detect-eval = "src.evaluate:main"
hf-detect-infer = "src.inference:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]
